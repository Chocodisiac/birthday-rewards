                 &lt;p style=&quot;line-height: 150.0%;&quot;&gt;*Firehouse Subs Rewards Members may be eligible for a free Medium Sub when they make a minimum $1.00 USD purchase when claiming the reward (“Birthday Sub Reward”), the day before their birthday, on their birthday, and the day following their birthday, as listed in their Account. To be eligible for a Birthday Sub Reward, Firehouse Subs Rewards Members must have also made a minimum $1.00 USD purchase within the previous six (6) months, but at least a minimum seven (7) days prior to their birthday using their Rewards Account, and must have registered their birthday on their Account either(i) prior to their birthday or (ii) on their birthday. If you sign up on your birthday or after your birthday, you will receive the Birthday Sub Reward the following year. If you are eligible to receive a Birthday Sub Reward, your Birthday Sub Reward will be automatically activated and ready for redemption in your Account on your birthday. The Birthday Sub Reward may be redeemed in restaurant by providing the Member’s phone number associated with the Account or scanning the 10-digit “Rewards Badge” code located in the “Earn” tab in your Account or online by logging in your Account on the App or Website. If you are eligible to receive a Birthday Sub Reward, your Birthday Sub Reward will be automatically activated and ready for redemption in your Account on your birthday. The Birthday Sub Reward is subject to availability at participating Firehouse Subs® restaurants in the Territory. You can only redeem one (1) Birthday Sub Reward per calendar year.&lt;/p&gt;
